# Reverse proxy for JECRC VLab. Terminate TLS here or at your load balancer (see docs/DEPLOYMENT.md).
server {
  listen 80;
  server_name _;
  client_max_body_size 25m;           # project uploads (MAX_UPLOAD_MB=20) + form overhead
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /_next/static/ {
    proxy_pass http://web:3000;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location /monaco/ {
    proxy_pass http://web:3000;
    expires 7d;
  }
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;          # code execution requests can take several seconds
  }
}
